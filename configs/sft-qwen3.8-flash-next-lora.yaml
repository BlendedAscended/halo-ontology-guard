# Qwen3.8-Flash-Next (qwen4_exp) — EP=8 LoRA SFT for 24-vertical ontology command compilation.
# Launch: torchrun --nproc_per_node=8 scripts/training/sft.py configs/sft-qwen3.8-flash-next-lora.yaml

# --- Model ---
model_name_or_path: Qwen/Qwen3.8-Flash-Next
text_only_model: true
attn_implementation: sdpa
moe_balancing: none

# --- Dataset ---
dataset:
  - data/ontology_guard/sft_ontology_compiler.jsonl
conversation_field: messages
test_size: 0.05

# --- Parallelism & MoE precision ---
expert_parallel_size: 8
fp32_grad_reduce: true

# --- LoRA ---
use_peft: true
lora_r: 32
lora_alpha: 64
lora_target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - in_proj_qkv
  - in_proj_z
  - in_proj_a
  - in_proj_b
  - out_proj
  - gate_up_proj
  - down_proj
merge_expert_lora_on_save: true

# --- Training ---
per_device_train_batch_size: 1
per_device_eval_batch_size: 1
gradient_accumulation_steps: 8
num_train_epochs: 2.0
packing: true
max_length: 8192
learning_rate: 1.0e-05
lr_scheduler_type: cosine
warmup_steps: 20

# --- Checkpointing & evaluation ---
save_steps: 250
eval_strategy: steps
eval_steps: 100
save_total_limit: 2
output_dir: checkpoints/sft-qwen3.8-flash-next-ontology
logging_steps: 1
logging_first_step: true
report_to: []
remove_unused_columns: false
dataloader_num_workers: 2
